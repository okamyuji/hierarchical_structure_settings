[package]
name = "hierarchical_structure_settings"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Yuji OKAMOTO"]
description = "階層型設定管理システム - Hierarchical configuration management system"
license = "MIT"
readme = "README.md"
repository = "https://github.com/okamyuji/hierarchical_structure_settings"
keywords = ["config", "configuration", "settings", "toml", "json"]
categories = ["config"]

[lib]
name = "hierarchical_structure_settings"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
toml = "1.1"
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
